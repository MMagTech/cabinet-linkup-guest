name: Build

# Every pull request and every push to main: the build and its tests on macOS and on Windows, and
# a read of every tracked file for anything private. Nothing here holds a secret.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Nothing private in a tracked file
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: ci/check-no-private.sh

  mac:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # GStreamer's own runtime and development packages, from its own site and held to these
      # checksums: the same version as Windows, for the game.
      GST_VERSION: 1.28.8
      GST_RUNTIME_SHA256: d371ab04a7632713626836c2fc234e863cc98484c74c473eba99b0fbd9b3a3fe
      GST_DEVEL_SHA256: e6d380bc17be7eccf13e0154567d4718fc9321da822408c7ca0cd808b3d4a3f7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true

      - name: GStreamer, from the cache
        id: gst
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: gst-pkg
          key: gstreamer-macos-universal-${{ env.GST_VERSION }}-1

      - name: GStreamer, fetched
        if: steps.gst.outputs.cache-hit != 'true'
        run: |
          mkdir -p gst-pkg
          base="https://gstreamer.freedesktop.org/data/pkg/osx/$GST_VERSION"
          curl -fsSL --retry 5 --retry-all-errors -o gst-pkg/runtime.pkg "$base/gstreamer-1.0-$GST_VERSION-universal.pkg"
          curl -fsSL --retry 5 --retry-all-errors -o gst-pkg/devel.pkg "$base/gstreamer-1.0-devel-$GST_VERSION-universal.pkg"
          echo "$GST_RUNTIME_SHA256  gst-pkg/runtime.pkg" | shasum -a 256 -c
          echo "$GST_DEVEL_SHA256  gst-pkg/devel.pkg" | shasum -a 256 -c

      # Kept as soon as it is fetched, so a build that fails later does not fetch it again.
      - name: GStreamer, into the cache
        if: steps.gst.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: gst-pkg
          key: gstreamer-macos-universal-${{ env.GST_VERSION }}-1

      - name: GStreamer, installed
        run: |
          sudo installer -pkg gst-pkg/runtime.pkg -target /
          sudo installer -pkg gst-pkg/devel.pkg -target /

      - name: Libraries
        run: brew install openssl@3 json-c ninja sdl3 sdl3_ttf
      - name: Build
        run: |
          cmake --preset default
          cmake --build --preset default
      - name: Test
        run: ctest --preset default
      - name: The screens, as pictures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: screens-macos
          path: build/shots
          if-no-files-found: ignore

  windows:
    name: Windows
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      # GStreamer's installer is fetched from its own site and held to this checksum. The program
      # uses GStreamer's OpenSSL, so that it holds one OpenSSL once the stream is built on it.
      GST_VERSION: 1.28.8
      GST_SHA256: e4c41ee6ee9c6c32a45d198463ec08d79bac3bd5fa58adc93d13fe4a08abc9d9
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true

      - name: GStreamer, from the cache
        id: gst
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: C:\gstreamer
          key: gstreamer-msvc-x86_64-${{ env.GST_VERSION }}-devel-1

      - name: GStreamer, installed
        if: steps.gst.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $file = "gstreamer-1.0-msvc-x86_64-$env:GST_VERSION.exe"
          curl.exe -fsSL --retry 3 -o $file "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GST_VERSION/msvc/$file"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:GST_SHA256) { throw "GStreamer's installer is not the file this was written for: $hash" }
          $run = Start-Process -FilePath ".\$file" -Wait -PassThru -ArgumentList `
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/ALLUSERS', '/TYPE=devel', '/DIR=C:\gstreamer', '/LOG=gst-install.log'
          if ($run.ExitCode -ne 0) {
            Get-Content gst-install.log -Tail 60
            throw "GStreamer's installer ended with $($run.ExitCode)"
          }
          Remove-Item $file

      # Kept as soon as it is installed, so a build that fails later does not fetch it again.
      - name: GStreamer, into the cache
        if: steps.gst.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: C:\gstreamer
          key: gstreamer-msvc-x86_64-${{ env.GST_VERSION }}-devel-1

      - name: Where GStreamer's OpenSSL is
        shell: pwsh
        run: |
          $header = Get-ChildItem C:\gstreamer -Recurse -Filter opensslv.h -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $header) {
            Get-ChildItem C:\gstreamer -Depth 3 | Select-Object -ExpandProperty FullName
            throw "GStreamer came without OpenSSL's headers"
          }
          $root = $header.Directory.Parent.Parent.FullName
          "GST_PREFIX=$root" >> $env:GITHUB_ENV
          "$root\bin" >> $env:GITHUB_PATH
          "GStreamer is at $root"
          Get-ChildItem "$root\lib", "$root\bin" -Filter *crypto* | Select-Object -ExpandProperty FullName
          "Visual Studio here:"
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -all -prerelease -format value -property displayName

      - name: vcpkg's packages, from the cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-x64-windows-static-md-${{ hashFiles('vcpkg.json') }}

      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows "-DGSTREAMER_ROOT=$env:GST_PREFIX"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test
        shell: pwsh
        run: ctest --preset windows
      - name: The screens, as pictures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: screens-windows
          path: build/shots
          if-no-files-found: ignore
