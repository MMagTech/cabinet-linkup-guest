name: Build

# Every pull request and every push to main: the build and its tests on macOS and on Windows, the two
# packages friends download (the Mac app in a DMG, the Windows Setup), each tried on its own, and a
# read of every tracked file for anything private. And the build with no game and its tests on Linux,
# which is not shipped, for those who port it.
#
# A tag v<version> does the same, and then makes a draft release on GitHub with both packages, which
# MMagTech publishes. Neither package is signed for other computers, and nothing here uses a secret.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Nothing private in a tracked file
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: ci/check-no-private.sh

  # The two that hold the structure, as CabinetOS learned to
  # (docs/decisions/2026-11-12-checks-hold-the-structure.md).
  long-files:
    name: Long files (report only)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Source files over 1,500 lines
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE" ]; then
            ci/check-long-files.sh "$BASE" "$HEAD"
          else
            ci/check-long-files.sh
          fi

  named-files:
    name: Docs and comments name what is there
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # Warnings until this day (UTC), then a failure.
      REPORT_ONLY_UNTIL: '2026-11-30'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true
      - run: python3 -I ci/check-named-files.py

  mac:
    name: macOS
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # GStreamer's own runtime and development packages, from its own site and held to these
      # checksums: the same version as Windows, for the game. ci/check-gstreamer.py says, once a
      # week, when a newer one with fixes is out.
      GST_VERSION: 1.28.8
      GST_RUNTIME_SHA256: d371ab04a7632713626836c2fc234e863cc98484c74c473eba99b0fbd9b3a3fe
      GST_DEVEL_SHA256: e6d380bc17be7eccf13e0154567d4718fc9321da822408c7ca0cd808b3d4a3f7
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true

      - name: GStreamer, from the cache
        id: gst
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: gst-pkg
          key: gstreamer-macos-universal-${{ env.GST_VERSION }}-1

      - name: GStreamer, fetched
        if: steps.gst.outputs.cache-hit != 'true'
        run: |
          mkdir -p gst-pkg
          base="https://gstreamer.freedesktop.org/data/pkg/osx/$GST_VERSION"
          curl -fsSL --retry 5 --retry-all-errors -o gst-pkg/runtime.pkg "$base/gstreamer-1.0-$GST_VERSION-universal.pkg"
          curl -fsSL --retry 5 --retry-all-errors -o gst-pkg/devel.pkg "$base/gstreamer-1.0-devel-$GST_VERSION-universal.pkg"
          echo "$GST_RUNTIME_SHA256  gst-pkg/runtime.pkg" | shasum -a 256 -c
          echo "$GST_DEVEL_SHA256  gst-pkg/devel.pkg" | shasum -a 256 -c

      # Kept as soon as it is fetched, so a build that fails later does not fetch it again.
      - name: GStreamer, into the cache
        if: steps.gst.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: gst-pkg
          key: gstreamer-macos-universal-${{ env.GST_VERSION }}-1

      - name: GStreamer, installed
        run: |
          sudo installer -pkg gst-pkg/runtime.pkg -target /
          sudo installer -pkg gst-pkg/devel.pkg -target /

      - name: vcpkg's packages, from the cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-arm64-osx-13-${{ hashFiles('vcpkg.json', 'cmake/triplets/*') }}

      # The app to hand out: vcpkg's libraries built in, for Apple silicon and macOS 13 or later.
      - name: Build
        run: |
          brew install ninja
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          export VCPKG_ROOT="$VCPKG_INSTALLATION_ROOT"
          cmake --preset mac
          cmake --build --preset mac
      - name: Test
        run: ctest --preset mac
      - name: The screens, as pictures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: screens-macos
          path: build-mac/shots
          if-no-files-found: ignore

      # The app as a friend gets it (CMakeLists.txt, "The Mac app"), tried with no GStreamer of the
      # computer's own, then put in a DMG.
      - name: The app
        run: |
          cmake --install build-mac --prefix dist
          du -sh "dist/2P Start.app"
          find "dist/2P Start.app" -type f | sed "s|^dist/||" | sort
      - name: The app, on its own
        run: ci/check-app.sh "dist/2P Start.app"
      - name: The DMG
        run: |
          ci/mac-package.sh "dist/2P Start.app" "dist/2P Start.dmg"
          du -h "dist/2P Start.dmg"
      - name: The DMG, kept
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: 2pstart-mac
          path: dist/2P Start.dmg
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      # GStreamer's installer is fetched from its own site and held to this checksum. The program
      # uses GStreamer's OpenSSL, so that it holds one OpenSSL once the stream is built on it.
      GST_VERSION: 1.28.8
      GST_SHA256: e4c41ee6ee9c6c32a45d198463ec08d79bac3bd5fa58adc93d13fe4a08abc9d9
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true

      - name: GStreamer, from the cache
        id: gst
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: C:\gstreamer
          key: gstreamer-msvc-x86_64-${{ env.GST_VERSION }}-devel-1

      - name: GStreamer, installed
        if: steps.gst.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $file = "gstreamer-1.0-msvc-x86_64-$env:GST_VERSION.exe"
          curl.exe -fsSL --retry 3 -o $file "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GST_VERSION/msvc/$file"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:GST_SHA256) { throw "GStreamer's installer is not the file this was written for: $hash" }
          $run = Start-Process -FilePath ".\$file" -Wait -PassThru -ArgumentList `
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/ALLUSERS', '/TYPE=devel', '/DIR=C:\gstreamer', '/LOG=gst-install.log'
          if ($run.ExitCode -ne 0) {
            Get-Content gst-install.log -Tail 60
            throw "GStreamer's installer ended with $($run.ExitCode)"
          }
          Remove-Item $file

      # Kept as soon as it is installed, so a build that fails later does not fetch it again.
      - name: GStreamer, into the cache
        if: steps.gst.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: C:\gstreamer
          key: gstreamer-msvc-x86_64-${{ env.GST_VERSION }}-devel-1

      - name: Where GStreamer's OpenSSL is
        shell: pwsh
        run: |
          $header = Get-ChildItem C:\gstreamer -Recurse -Filter opensslv.h -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $header) {
            Get-ChildItem C:\gstreamer -Depth 3 | Select-Object -ExpandProperty FullName
            throw "GStreamer came without OpenSSL's headers"
          }
          $root = $header.Directory.Parent.Parent.FullName
          "GST_PREFIX=$root" >> $env:GITHUB_ENV
          "$root\bin" >> $env:GITHUB_PATH
          "GStreamer is at $root"
          Get-ChildItem "$root\lib", "$root\bin" -Filter *crypto* | Select-Object -ExpandProperty FullName
          Get-ChildItem "$root\bin" -Filter pkg-config* | Select-Object -ExpandProperty FullName
          "Visual Studio here:"
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -all -prerelease -format value -property displayName

      - name: vcpkg's packages, from the cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-x64-windows-static-md-${{ hashFiles('vcpkg.json') }}

      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows "-DGSTREAMER_ROOT=$env:GST_PREFIX"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test
        shell: pwsh
        run: ctest --preset windows
      - name: The screens, as pictures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: screens-windows
          path: build/shots
          if-no-files-found: ignore

      # The app as a friend gets it: a folder that runs on a PC with nothing installed (CMakeLists.txt,
      # "The Windows app"), in a Setup (ci/windows-setup.iss), which is installed, tried with nothing
      # else of GStreamer's there, and uninstalled.
      - name: The app's folder
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix "dist\2P Start"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = Get-ChildItem "dist\2P Start" -Recurse -File
          "{0} files, {1:N1} MB" -f $files.Count, (($files | Measure-Object Length -Sum).Sum / 1MB)
          $files | ForEach-Object { $_.FullName.Substring((Resolve-Path "dist\2P Start").Path.Length + 1) }
      - name: The Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $version = (Select-String -Path CMakeLists.txt -Pattern '^project\(cabinet-linkup-guest VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          & $iscc /Q "/DAppVersion=$version" "/DSource=$(Resolve-Path 'dist\2P Start')" "/DOutput=$(Resolve-Path dist)" ci\windows-setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: The Setup, tried
        shell: pwsh
        run: ci/check-setup.ps1 "dist\2P Start Setup.exe"
      - name: The icons, as Windows shows them
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: icons-windows
          path: ${{ runner.temp }}/windows-icons
          if-no-files-found: ignore
      - name: The Setup, kept
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: 2pstart-windows
          path: dist/2P Start Setup.exe
          if-no-files-found: error

  # Linux, which is not shipped: the build with no game, and its tests, so the stand-ins another
  # system starts from (docs/ARCHITECTURE.md, "Each system's own") keep building. On Ubuntu's own
  # packages, as a person porting it would build: 26.04's OpenSSL is 3.2 or later, which Argon2id needs.
  linux:
    name: Linux (built, not shipped)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true
      - name: Ubuntu's packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libssl-dev libcurl4-openssl-dev \
            libjson-c-dev libsdl3-dev libsdl3-ttf-dev
      - name: Build
        run: |
          cmake --preset default -DTWOPSTART_GAME=OFF
          cmake --build --preset default
      - name: Test
        run: ctest --preset default
      - name: The screens, as pictures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: screens-linux
          path: build/shots
          if-no-files-found: ignore

  # A tag v<version>: a draft release with both packages, named for the version, which MMagTech
  # publishes once he has tried them. The tag must be the version the build says it is.
  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, mac, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: 2pstart-windows
          path: packages/windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: 2pstart-mac
          path: packages/mac
      - name: The release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^project(cabinet-linkup-guest VERSION \([0-9.]*\) .*/\1/p' CMakeLists.txt)"
          if [ "$TAG" != "v$version" ]; then
            echo "The tag is $TAG, but the build says it is version $version" >&2
            exit 1
          fi
          mv "packages/windows/2P Start Setup.exe" "packages/2P-Start-$version-Windows-Setup.exe"
          mv "packages/mac/2P Start.dmg" "packages/2P-Start-$version-Mac.dmg"
          sed "s/@VERSION@/$version/g" ci/release-notes.md > packages/notes.md
          gh release create "$TAG" --draft --title "2P Start $version" --notes-file packages/notes.md \
            "packages/2P-Start-$version-Windows-Setup.exe" "packages/2P-Start-$version-Mac.dmg"
